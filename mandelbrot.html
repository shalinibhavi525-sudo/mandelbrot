<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandelbrot Explorer | Infinite Mathematical Beauty</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            background: rgba(0, 0, 0, 0.9);
            border-bottom: 2px solid #00ff00;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 10px #00ff00;
        }

        .controls {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 12px;
        }

        .control-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-item label {
            opacity: 0.7;
            font-size: 10px;
        }

        .control-item span {
            font-weight: bold;
            color: #00ff00;
        }

        button {
            background: transparent;
            border: 1px solid #00ff00;
            color: #00ff00;
            padding: 8px 16px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            transition: all 0.3s;
        }

        button:hover {
            background: #00ff00;
            color: #0a0a0a;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        canvas {
            cursor: crosshair;
            border: 2px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 20px;
            text-shadow: 0 0 20px #00ff00;
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border: 1px solid #00ff00;
            border-radius: 5px;
            text-align: center;
            font-size: 12px;
            opacity: 0.8;
        }

        .instructions p {
            margin: 5px 0;
        }

        .credit {
            position: absolute;
            top: 80px;
            right: 30px;
            font-size: 10px;
            opacity: 0.5;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">♾️ MANDELBROT EXPLORER</div>
        <div class="controls">
            <div class="control-item">
                <label>ZOOM LEVEL</label>
                <span id="zoomDisplay">1.00x</span>
            </div>
            <div class="control-item">
                <label>ITERATIONS</label>
                <span id="iterDisplay">100</span>
            </div>
            <div class="control-item">
                <label>CENTER</label>
                <span id="centerDisplay">(0.00, 0.00)</span>
            </div>
            <button onclick="reset()">RESET</button>
            <button onclick="changeColorScheme()">COLORS</button>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="loading" class="loading" style="display: none;">COMPUTING INFINITY...</div>
        <div class="instructions">
            <p><strong>CLICK</strong> anywhere to zoom in | <strong>RIGHT-CLICK</strong> to zoom out</p>
            <p>Explore the infinite complexity of the Mandelbrot set</p>
        </div>
    </div>

    <div class="credit">
        Built by Shambhavi Singh<br>
        Tripura, India 🇮🇳
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');

        canvas.width = window.innerWidth - 100;
        canvas.height = window.innerHeight - 150;

        let centerX = -0.5;
        let centerY = 0;
        let zoom = 1;
        let maxIterations = 100;
        let colorScheme = 0;

        const colorSchemes = [
            (iter, max) => {
                if (iter === max) return [0, 0, 0];
                const hue = (iter / max) * 360;
                return hslToRgb(hue, 100, 50);
            },
            (iter, max) => {
                if (iter === max) return [0, 0, 0];
                const t = iter / max;
                return [255 * t, 100 * t, 0];
            },
            (iter, max) => {
                if (iter === max) return [0, 0, 0];
                const t = iter / max;
                return [0, 150 * t, 255 * t];
            },
            (iter, max) => {
                if (iter === max) return [0, 0, 0];
                const t = iter / max;
                return [0, 255 * t, 50 * t];
            }
        ];

        function hslToRgb(h, s, l) {
            s /= 100;
            l /= 100;
            const k = n => (n + h / 30) % 12;
            const a = s * Math.min(l, 1 - l);
            const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
            return [255 * f(0), 255 * f(8), 255 * f(4)];
        }

        function mandelbrot(cx, cy) {
            let x = 0, y = 0;
            let iter = 0;

            while (x * x + y * y <= 4 && iter < maxIterations) {
                const xTemp = x * x - y * y + cx;
                y = 2 * x * y + cy;
                x = xTemp;
                iter++;
            }

            return iter;
        }

        function draw() {
            loading.style.display = 'block';

            requestAnimationFrame(() => {
                const imageData = ctx.createImageData(canvas.width, canvas.height);
                const data = imageData.data;

                const scale = 4 / (canvas.width * zoom);

                for (let px = 0; px < canvas.width; px++) {
                    for (let py = 0; py < canvas.height; py++) {
                        const x = centerX + (px - canvas.width / 2) * scale;
                        const y = centerY + (py - canvas.height / 2) * scale;

                        const iter = mandelbrot(x, y);
                        const [r, g, b] = colorSchemes[colorScheme](iter, maxIterations);

                        const index = (py * canvas.width + px) * 4;
                        data[index] = r;
                        data[index + 1] = g;
                        data[index + 2] = b;
                        data[index + 3] = 255;
                    }
                }

                ctx.putImageData(imageData, 0, 0);
                loading.style.display = 'none';

                document.getElementById('zoomDisplay').textContent = zoom.toFixed(2) + 'x';
                document.getElementById('iterDisplay').textContent = maxIterations;
                document.getElementById('centerDisplay').textContent = 
                    `(${centerX.toFixed(4)}, ${centerY.toFixed(4)})`;
            });
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const px = e.clientX - rect.left;
            const py = e.clientY - rect.top;

            const scale = 4 / (canvas.width * zoom);
            centerX = centerX + (px - canvas.width / 2) * scale;
            centerY = centerY + (py - canvas.height / 2) * scale;

            zoom *= 2;
            maxIterations += 20;

            draw();
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            
            zoom /= 2;
            maxIterations = Math.max(100, maxIterations - 20);

            draw();
        });

        function reset() {
            centerX = -0.5;
            centerY = 0;
            zoom = 1;
            maxIterations = 100;
            draw();
        }

        function changeColorScheme() {
            colorScheme = (colorScheme + 1) % colorSchemes.length;
            draw();
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth - 100;
            canvas.height = window.innerHeight - 150;
            draw();
        });

        draw();
    </script>
</body>
</html>
